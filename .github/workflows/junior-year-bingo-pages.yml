name: Deploy junior year bingo

on:
  push:
    branches: [main]
    paths:
      - "Suhana Junior Year Bingo Sheet/**"
      - ".github/workflows/junior-year-bingo-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: junior-year-bingo-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: "Suhana Junior Year Bingo Sheet"
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
